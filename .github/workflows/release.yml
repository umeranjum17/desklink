name: release

# A release is a merge of a version-bump PR. Pushing to main (or the manual
# button, from main only) runs the tests, builds the per-OS engine platform
# packages, packs every tarball, then publishes what is new in dependency
# order: the engine platform packages, @desklink/host, @desklink/axi and
# @desklink/react-native. Pull requests run the same jobs except publish (main
# only), so the build and pack matrix is proven before the merge.
# Trusted publishing only: OIDC via `id-token: write` below, `--provenance` on
# every publish, and no token or key material anywhere in this file or its logs.
#
# Out of scope: rtc-sctp-source (a Rust workspace with no npm packages), any
# version bump, and the npm-side trusted-publisher linking (Main does that
# side; the publish steps fail until then, which is expected, not a defect).
#
# Explicit named gaps (not silent coverage):
#   G1. No native compilation here. @desklink/host ships Rust engine *sources*
#       (engine/src, Cargo.toml/lock, build.rs) and @desklink/react-native
#       ships android/ios *sources*; the build-pack matrix below only proves
#       the TypeScript build and `npm pack --dry-run` contents per OS.
#   G2. The Windows/MSVC engine is built and tested by the `engine-windows`
#       job in ci.yml, not here. This workflow builds the Linux x64 (glibc)
#       and macOS arm64 release engines that back the published platform
#       packages; capture and input still require a dedicated rig.
#   G3. Android Gradle and iOS Xcode compilation of the react-native sources
#       are built nowhere in CI; neither workflow proves them.
#   G4. macOS signing/TCC qualification and all capture/input rig proofs stay
#       on their dedicated rig lanes.
#   G5. End-to-end publish cannot pass until Main links @desklink/axi,
#       @desklink/react-native, @desklink/host and the engine platform
#       packages as npm trusted publishers; until then the publish steps fail
#       on OIDC authorization, which is the known limitation, not a defect.
#   G6. Ordered, fail-soft publish: the engine platform packages go first,
#       then @desklink/host, then @desklink/axi, so a dependent only ever
#       names a pin the registry already serves. @desklink/react-native pins
#       neither and always publishes. One package's failure never stops the
#       others, the job still ends red, and every hold or failure prints an
#       ::error:: naming the package, the version and what to do.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publishes must not overlap: queue main pushes instead of cancelling them.
# Pull-request runs only prove the build and pack matrix (publish is main-only),
# so a superseded PR run is cancelled instead of spending runners on a stale head.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate: the repo's test suite plus the version lockstep invariant. The
  # workflow fails here when either fails; nothing builds or publishes.
  test:
    name: test (vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # @desklink/host, @desklink/react-native and @desklink/axi ship as one
      # release; a half-bump fails here instead of at publish time.
      - name: Version lockstep across host, react-native and axi
        run: node packages/desktop-host/release/check-lockstep.mjs
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Proves what CI can build per OS: the TS build plus the exact file set
  # `npm pack` would publish for every workspace (host Rust sources and
  # react-native android/ios sources included). See G1-G4 above for what this
  # matrix deliberately does not build.
  build-pack:
    name: build + pack (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # What would be published, so a manifest change that drops a shipped
      # file (engine sources, android/ios sources) fails before publish.
      - run: npm pack --dry-run --workspaces

  # Builds the compiled dist for the pack job, without id-token.
  build:
    name: build (dist artifacts)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: axi-dist
          path: packages/axi/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: host-dist
          path: packages/desktop-host/dist
          if-no-files-found: error

  # Per-OS engine build: the prebuilt platform packages the host pins. Each OS
  # builds with its pinned release script and uploads the engine output for the
  # pack job, without id-token.
  engine:
    name: engine (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-24.04
          - platform: darwin-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance must name the candidate, not GitHub's merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build the Linux engine in the pinned container
        if: matrix.platform == 'linux-x64-gnu'
        run: packages/desktop-host/release/build-engine.sh
      - name: Rust (the version the release build pins)
        if: matrix.platform == 'darwin-arm64'
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Build the macOS arm64 engine with static libvpx
        if: matrix.platform == 'darwin-arm64'
        shell: bash
        run: |
          brew install libvpx
          test -f "$(brew --prefix libvpx)/lib/libvpx.a"
          packages/desktop-host/release/build-engine-macos-arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: dist-desklink/engine-${{ matrix.platform }}
          if-no-files-found: error

  # Packs the platform packages and the host with its engine pins, no id-token.
  pack:
    name: pack tarballs
    needs: [build, engine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: host-dist
          path: packages/desktop-host/dist
      - uses: actions/download-artifact@v4
        with:
          name: axi-dist
          path: packages/axi/dist
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux-x64-gnu
          path: dist-desklink/engine-linux-x64-gnu
      - uses: actions/download-artifact@v4
        with:
          name: engine-darwin-arm64
          path: dist-desklink/engine-darwin-arm64
      # Each call packs that platform's package and the host, whose
      # optionalDependencies pin both engine platforms to this version.
      - run: node packages/desktop-host/release/pack.mjs --engine dist-desklink/engine-linux-x64-gnu --platform linux-x64-gnu
      - run: node packages/desktop-host/release/pack.mjs --engine dist-desklink/engine-darwin-arm64 --platform darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: desklink-tarballs
          path: dist-desklink/*.tgz
          if-no-files-found: error

  # Publishes every package in dependency order (G6), on main only; a manual run
  # from any other ref builds but never publishes. Downloads the packed tarballs
  # and runs no install or build step.
  publish:
    name: publish new versions
    if: github.ref == 'refs/heads/main'
    needs: [test, build, build-pack, engine, pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Assert npm 11.5+ for --provenance
        run: |
          NPM_V="$(npm --version)"
          echo "npm $NPM_V"
          printf '11.5.0\n%s\n' "$NPM_V" | sort -CV || { echo "::error::npm $NPM_V is below 11.5, which --provenance requires"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: desklink-tarballs
          path: dist-desklink
      - name: Publish new versions in dependency order
        run: |
          # registry_state, wait_published and the read-back budget live in one
          # place, shared with release/publish.mjs, so both routes agree.
          source packages/desktop-host/release/readback.sh
          failed=0
          spec_of() {
            tar -xzOf "$1" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{const m=JSON.parse(s);process.stdout.write(m.name+"@"+m.version)})'
          }
          publish_one() {
            local tarball="$1" spec
            if [ ! -f "$tarball" ]; then
              echo "::error::$tarball was not produced by the pack job; nothing was published for it. Re-run the workflow."
              failed=1
              return
            fi
            spec="$(spec_of "$tarball")"
            case "$(registry_state "$spec")" in
              published) echo "$spec is already on the registry; skipping publish." ;;
              missing)
                echo "Publishing $spec ..."
                # ./ keeps npm reading the argument as the local file it is:
                # a bare "dist-desklink/x.tgz" is parsed as the git shorthand
                # "user/repo" and fails on ssh auth instead of publishing.
                npm publish "./$tarball" --provenance --access public || { echo "::error::npm publish of $spec failed; the other packages were still attempted. Fix the cause and re-run the workflow."; failed=1; } ;;
              *) failed=1 ;;
            esac
          }
          HOST_VER="$(node -p "require('./packages/desktop-host/package.json').version")"
          AXI_VER="$(node -p "require('./packages/axi/package.json').version")"
          RN_VER="$(node -p "require('./packages/desktop-client/package.json').version")"
          HOST_TGZ="dist-desklink/desklink-host-$HOST_VER.tgz"
          if [ ! -f "$HOST_TGZ" ]; then echo "::error::$HOST_TGZ is missing from the pack job; nothing was published. Re-run the workflow."; exit 1; fi
          # The engine platform packages, exactly the pins the packed host declares.
          PLATFORMS="$(tar -xzOf "$HOST_TGZ" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{const m=JSON.parse(s);for(const [n,v] of Object.entries(m.optionalDependencies??{}))process.stdout.write(n+"\t"+v+"\n")})')"
          while IFS=$'\t' read -r PNAME PVER; do
            [ -n "$PNAME" ] || continue
            MANGLE="${PNAME#@}"; MANGLE="${MANGLE//\//-}"
            publish_one "dist-desklink/${MANGLE}-${PVER}.tgz"
          done <<< "$PLATFORMS"
          # Hold the host until every engine platform it pins is on the
          # registry, so npm never serves a host whose pins cannot resolve.
          host_ready=true
          registry_error=false
          [ -n "$PLATFORMS" ] || host_ready=false
          while IFS=$'\t' read -r PNAME PVER; do
            [ -n "$PNAME" ] || continue
            rc=0
            wait_published "${PNAME}@${PVER}" || rc=$?
            case "$rc" in
              0) ;;
              1) host_ready=false ;;
              *) host_ready=false; registry_error=true ;;
            esac
          done <<< "$PLATFORMS"
          if [ "$host_ready" = true ]; then
            publish_one "$HOST_TGZ"
          elif [ "$registry_error" = true ]; then
            echo "::error::@desklink/host@$HOST_VER is held and not published: the registry check above failed (registry, auth or network), so whether an engine platform package it pins is on the registry is unknown. Fix the registry failure above, then re-run this workflow."
            failed=1
          else
            echo "::error::@desklink/host@$HOST_VER is held: an engine platform package it pins is not on the registry, and publishing the host now would name a pin npm cannot resolve. Fix the failed package above, then re-run this workflow."
            failed=1
          fi
          # @desklink/axi pins @desklink/host, so it goes out only once the host
          # it names is on the registry.
          axi_ready=false
          if [ "$host_ready" = true ]; then
            rc=0
            wait_published "@desklink/host@$HOST_VER" || rc=$?
            case "$rc" in
              0) axi_ready=true ;;
              1) ;;
              *) registry_error=true ;;
            esac
          fi
          if [ "$axi_ready" = true ]; then
            publish_one "dist-desklink/desklink-axi-$AXI_VER.tgz"
          elif [ "$registry_error" = true ]; then
            echo "::error::@desklink/axi@$AXI_VER is held and not published: the registry check for @desklink/host@$HOST_VER above failed (registry, auth or network), so whether it is on the registry is unknown. Fix the registry failure above, then re-run this workflow."
            failed=1
          else
            echo "::error::@desklink/axi@$AXI_VER is held: @desklink/host@$HOST_VER is not on the registry, and publishing axi now would name a pin npm cannot resolve. Fix @desklink/host, then re-run this workflow."
            failed=1
          fi
          # @desklink/react-native pins neither the host nor axi, so it always publishes.
          publish_one "dist-desklink/desklink-react-native-$RN_VER.tgz"
          exit $failed
