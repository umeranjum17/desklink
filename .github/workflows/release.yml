name: release

# A release is a merge of a version-bump PR. Pushing to main (or the manual
# button) runs the tests, then publishes @desklink/axi and
# @desklink/react-native whose exact versions are not yet on the npm
# registry. @desklink/host plus the platform engine packages stay on the
# pack path (packages/desktop-host/release/pack.mjs + publish.mjs) until the
# engine follow-up lane: this workflow never publishes the host, and a new
# host version fails the publish job closed instead of shipping pin-less.
# Trusted publishing only: OIDC via `id-token: write` below, `--provenance`
# on every publish, no NPM_TOKEN and no key material anywhere in this file
# or its logs.
#
# Out of scope: rtc-sctp-source (a Rust workspace with no npm packages), any
# version bump, and the npm-side trusted-publisher linking (Main does that
# side; the publish steps fail until then, which is expected, not a defect).
#
# Explicit named gaps (not silent coverage):
#   G1. No native compilation here. @desklink/host ships Rust engine *sources*
#       (engine/src, Cargo.toml/lock, build.rs) and @desklink/react-native
#       ships android/ios *sources*; the build-pack matrix below only proves
#       the TypeScript build and `npm pack --dry-run` contents per OS.
#   G2. Rust engine per-OS binaries (Linux/Windows/MSVC+static libvpx/macOS
#       ARM64) are built and tested by the `engine*` jobs in ci.yml, not here.
#   G3. Android Gradle and iOS Xcode compilation of the react-native sources
#       are built nowhere in CI; neither workflow proves them.
#   G4. macOS signing/TCC qualification and all capture/input rig proofs stay
#       on their dedicated rig lanes.
#   G5. End-to-end publish cannot pass until Main links @desklink/axi and
#       @desklink/react-native as npm trusted publishers; until then the
#       publish steps fail on OIDC authorization, which is the known
#       limitation, not a workflow defect. Host and engine packages link and
#       publish separately on the pack path (engine follow-up lane).
#   G6. Host hold (fail-closed, never a silent skip): this workflow never
#       publishes @desklink/host, which would ship without the platform
#       engine optionalDependencies pins. When the host version is not yet on
#       the registry, the publish job fails with the engine follow-up lane
#       named, instead of publishing a pin-less host or skipping silently.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publishes must not overlap: queue main pushes instead of cancelling them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the repo's own test suite (root `npm test`, vitest). The workflow
  # fails here when tests fail; nothing publishes.
  test:
    name: test (vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Proves what CI can build per OS: the TS build plus the exact file set
  # `npm pack` would publish for every workspace (host Rust sources and
  # react-native android/ios sources included). See G1-G4 above for what this
  # matrix deliberately does not build.
  build-pack:
    name: build + pack (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # What would be published, so a manifest change that drops a shipped
      # file (engine sources, android/ios sources) fails before publish.
      - run: npm pack --dry-run --workspaces

  # Publishes @desklink/axi and @desklink/react-native whose exact versions
  # are new on the registry. @desklink/host is held, never published here
  # (see G6): it needs the platform engine packages from the pack path.
  # Already-published versions are skipped, so re-runs are safe.
  publish:
    name: publish new versions
    needs: [test, build-pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Ensure npm 11.5+
        run: |
          npm install -g "npm@^11"
          NPM_V="$(npm --version)"
          echo "npm $NPM_V"
          node -e "const m = /^(\d+)\.(\d+)/.exec(process.argv[1]); const major = +m[1], minor = +m[2]; if (major < 11 || (major === 11 && minor < 5)) { console.error('requires npm >= 11.5, have ' + process.argv[1]); process.exit(1); }" "$NPM_V"
      - run: npm ci
      # dist/ is gitignored, so publish the build this run just proved.
      - run: npm run build
      # Fail-closed host guard (G6): the host ships only via the pack path
      # with its engine pins, so a new host version stops this job here with
      # the follow-up named, instead of publishing pin-less or skipping.
      - name: Fail closed when @desklink/host has an unpublished version
        run: |
          PKG="$(node -p "require('./packages/desktop-host/package.json').name")"
          VER="$(node -p "require('./packages/desktop-host/package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on the registry; host needs no engine release."
          else
            echo "::error::$PKG@$VER is not on the registry. This workflow never publishes the host: it would ship without the platform engine optionalDependencies pins. Cut the host + engine release on the pack path (packages/desktop-host/release/pack.mjs + publish.mjs) in the engine follow-up lane, then re-run this workflow."
            exit 1
          fi
      - name: Publish axi and react-native when their versions are new
        run: |
          for dir in packages/axi packages/desktop-client; do
            PKG="$(node -p "require('./$dir/package.json').name")"
            VER="$(node -p "require('./$dir/package.json').version")"
            echo "Registry check: $PKG@$VER"
            if npm view "$PKG@$VER" version >/dev/null 2>&1; then
              echo "$PKG@$VER is already on the registry; skipping publish."
            else
              echo "Publishing $PKG@$VER ..."
              npm publish "$dir" --provenance --access public
            fi
          done
