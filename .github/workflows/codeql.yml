name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        if: matrix.language == 'cpp' || matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev \
            libvpx-dev libpipewire-0.3-dev libxkbcommon-dev libwayland-dev libfreetype6-dev libfontconfig1-dev libevdev-dev libxcb1-dev libxcursor-dev libxext-dev
      - name: Rust toolchain
        if: matrix.language == 'cpp' || matrix.language == 'rust'
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build engine
        if: matrix.language == 'cpp'
        run: cargo build --manifest-path packages/desktop-host/engine/Cargo.toml
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
