name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

# One run per pull request. A new push cancels the superseded run so runners
# are not spent on stale heads; runs on main (pushes and the weekly schedule)
# are never cancelled. The PR number is stable across pushes, and only
# pull_request events cancel.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only or otherwise unrelated change cannot affect what CodeQL scans,
  # so the three-language matrix is skipped. This job always runs instead, so a
  # skipped analysis still reports rather than leaving the PR waiting.
  changes:
    name: classify
    # Drafts do not run CI; ready_for_review starts it when the PR is marked ready.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify the changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            # Not a pull request (main push or the weekly schedule): always run.
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          git diff --no-renames --name-only "origin/$GITHUB_BASE_REF" HEAD > "$RUNNER_TEMP/changed-files.txt"
          bash .github/workflows/classify-changes.sh heavy < "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        if: matrix.language == 'cpp' || matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev \
            libvpx-dev libpipewire-0.3-dev libxkbcommon-dev libwayland-dev libfreetype6-dev libfontconfig1-dev libevdev-dev libxcb1-dev libxcursor-dev libxext-dev
      - name: Rust toolchain
        if: matrix.language == 'cpp' || matrix.language == 'rust'
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build engine
        if: matrix.language == 'cpp'
        run: cargo build --manifest-path packages/desktop-host/engine/Cargo.toml
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
