name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cd packages/axi && npx -y axi-axi validate 'node bin/desklink-axi.js' --dir .
      # What would be published, so a manifest change that drops a file shows here.
      - run: npm pack --dry-run --workspaces

  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev \
            libvpx-dev libpipewire-0.3-dev libxkbcommon-dev libwayland-dev libevdev-dev libxcb1-dev libxcursor-dev xvfb tesseract-ocr
      - name: Rust (the version the release build pins)
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            packages/desktop-host/engine/target
          key: engine-${{ hashFiles('packages/desktop-host/engine/Cargo.lock') }}
      - run: cargo test --manifest-path packages/desktop-host/engine/Cargo.toml
      - run: cargo build --manifest-path packages/desktop-host/engine/Cargo.toml
      - run: npm ci && npm run build
      - run: node packages/axi/test/flow.mjs
        env:
          DESKLINK_AXI_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/debug/desklink-host
