name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# One run per workflow+ref. A new push to a pull request cancels the superseded
# run so runners are not spent on stale heads; pushes to main are never
# cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a change can affect, so docs/evidence-only changes skip
  # the whole matrix and a package-only change skips native jobs it cannot
  # touch. Always runs, so this context reports on every PR. `packages` covers
  # every JS/TS workspace input; `native` covers the desktop-host engine and its
  # release seams. A workflow edit is in both, so CI changes still exercise CI.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - 'packages/**'
            native:
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/desktop-host/**'

  # Runs when any JS/TS workspace input changed. Skipped on a docs-only or
  # native-only change.
  browser:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chromium + Xvfb for the browser-lane flow
        run: |
          npx -y playwright@1.62.1 install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - run: node packages/axi/test/browser-flow.mjs

  packages:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cd packages/axi && npx -y axi-axi validate 'node bin/desklink-axi.js' --dir .
      # What would be published, so a manifest change that drops a file shows here.
      - run: npm pack --dry-run --workspaces

  # The same package-level checks the Linux `packages` job runs, on Windows:
  # install, build, test, the axi validation and the pack dry run. Capture and
  # input stay in the dedicated rig lanes.
  packages-windows:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true' }}
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx -y axi-axi validate 'node bin/desklink-axi.js' --dir .
        working-directory: packages/axi
      - run: npm pack --dry-run --workspaces

  engine:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev \
            libvpx-dev libpipewire-0.3-dev libxkbcommon-dev libwayland-dev libfreetype6-dev libfontconfig1-dev libevdev-dev libxcb1-dev libxcursor-dev libxext-dev xvfb x11-utils xauth tesseract-ocr \
            dbus at-spi2-core python3-gi gir1.2-gtk-3.0 sway foot grim python3-pil fonts-dejavu-core
      - name: Rust (the version the release build pins)
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            packages/desktop-host/engine/target
          key: engine-linux-${{ hashFiles('packages/desktop-host/engine/Cargo.lock') }}
      - run: cargo test --manifest-path packages/desktop-host/engine/Cargo.toml
      - run: cargo build --manifest-path packages/desktop-host/engine/Cargo.toml
      - name: Point cue on a private headless Wayland compositor
        run: python3 packages/desktop-host/engine/test/point-wayland-flow.py
        env:
          DESKLINK_POINT_EVIDENCE_DIR: ${{ runner.temp }}/desklink-point-wayland
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/desktop-host/engine/target
      - run: npm ci && npm run build
      - run: npm run test:lab-safety
      - run: node packages/axi/test/flow.mjs
        env:
          DESKLINK_AXI_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/debug/desklink-host
      - run: node packages/axi/test/a11y-flow.mjs
        env:
          DESKLINK_AXI_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/debug/desklink-host
      # The encoded source, decoded by a real Chrome through the client package's
      # web implementation. It prints a skip and passes where no Chrome exists.
      - run: node packages/desktop-host/test/encoded-flow.mjs
        env:
          DESKLINK_AXI_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/debug/desklink-host
      # The client hook's P3a baseline roam (12s same-address outage) on an
      # owned Xvfb, reusing the engine build above. Report-only
      # (continue-on-error): CI runners are small and contended, so its timing
      # is a floor, not a gate.
      - name: Client roam-flow (hook reattach, 12s same-address outage)
        continue-on-error: true
        run: |
          chrome=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)
          echo "chrome: $chrome"
          env -u DISPLAY -u WAYLAND_DISPLAY DESKLINK_CHROME="$chrome" \
            node packages/desktop-client/test/roam-flow.mjs "$RUNNER_TEMP/desklink-roam-flow" \
              --adapter hook --outage 12000 --path same-address
        env:
          DESKLINK_AXI_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/debug/desklink-host
          DESKLINK_VERIFY_TARGET: ${{ github.workspace }}/packages/desktop-host/engine/target/debug/examples/x11_target

  # Hosted transport proof only: native capture/input requires a dedicated rig.
  # Runs only when the desktop-host engine or its release inputs changed.
  engine-windows:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the version the release build pins)
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            packages/desktop-host/engine/target
          key: engine-windows-${{ hashFiles('packages/desktop-host/engine/Cargo.lock') }}
      - run: cargo build --locked --target x86_64-pc-windows-msvc --manifest-path packages/desktop-host/engine/Cargo.toml
      - run: cargo test --locked --target x86_64-pc-windows-msvc --manifest-path packages/desktop-host/engine/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The whole published set, so the install proof below packs what ships.
      - run: npm run build
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # The static libvpx (/MT) MSVC build is a ~3 min step that only changes
      # with its script, so cache the prefix and rebuild only on a miss.
      - uses: actions/cache@v4
        id: vpx
        with:
          path: ${{ runner.temp }}/desklink-vpx
          key: libvpx-win-${{ hashFiles('packages/desktop-host/release/build-libvpx-win.ps1') }}
      - name: Build static MSVC libvpx (/MT)
        if: steps.vpx.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packages/desktop-host/release/build-libvpx-win.ps1 -OutDir "$env:RUNNER_TEMP/desklink-vpx"
      - name: Point the engine build at the static libvpx (/MT)
        shell: pwsh
        run: |
          "DESKLINK_VPX_STATIC_DIR=$env:RUNNER_TEMP/desklink-vpx/prefix" >> $env:GITHUB_ENV
          "RUSTFLAGS=-Ctarget-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Build and test Windows serving engine
        run: |
          cargo build --locked --target x86_64-pc-windows-msvc --manifest-path packages/desktop-host/engine/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc --manifest-path packages/desktop-host/engine/Cargo.toml
      - name: Assert no libvpx or dynamic MSVC runtime DLL dependency
        shell: pwsh
        run: |
          $dependencies = & dumpbin /dependents packages/desktop-host/engine/target/x86_64-pc-windows-msvc/debug/desklink-host.exe
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $dependencies
          if ($dependencies -match '(?i)(vpx|vcruntime|msvcp|msvcr|ucrtbase)[^\s]*\.dll') {
            throw 'Engine depends on a libvpx or dynamic CRT DLL'
          }
      - name: Encoded-source Chrome decode and input relay (required)
        run: node packages/desktop-host/test/encoded-flow.mjs
        env:
          DESKLINK_AXI_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/x86_64-pc-windows-msvc/debug/desklink-host.exe
          DESKLINK_REQUIRE_CHROME: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-libvpx-notices
          path: ${{ runner.temp }}/desklink-vpx/prefix/THIRD_PARTY_LICENSES.txt

      - name: Windows Node resolver and serve handshake via the published API (no desktop access)
        run: node packages/desktop-host/test/windows-resolver.mjs
        env:
          DESKLINK_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/x86_64-pc-windows-msvc/debug/desklink-host.exe
      # A consumer installs the published packages into an empty project and
      # starts the engine. Installation and startup on a hosted machine only:
      # capture, input, encoding quality and the desktop stay with the rig lanes.
      - name: Windows clean-project install of the packed packages, then engine startup
        run: node packages/desktop-host/test/windows-install.mjs
        env:
          DESKLINK_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/x86_64-pc-windows-msvc/debug/desklink-host.exe

  # Standard hosted ARM64 runner: build/pack/install the existing unsigned CLI
  # release path without capture, input, or interactive macOS qualification.
  # Runs only when the engine or its release inputs changed.
  engine-macos-seam:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Distribution provenance must name the candidate, not GitHub's
          # synthetic pull-request merge commit. Other jobs test that merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Rust (the version the release build pins)
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            packages/desktop-host/engine/target
          key: engine-macos-${{ hashFiles('packages/desktop-host/engine/Cargo.lock') }}
      - run: cargo build --locked --manifest-path packages/desktop-host/engine/Cargo.toml
      - run: cargo test --locked --manifest-path packages/desktop-host/engine/Cargo.toml
      - run: packages/desktop-host/engine/target/debug/desklink-host capabilities
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build matching Darwin release artifact with static libvpx
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          brew install libvpx
          test -f "$(brew --prefix libvpx)/lib/libvpx.a"
          npm ci && npm run build
          packages/desktop-host/release/build-engine-macos-arm64.sh
          node packages/desktop-host/release/pack.mjs --engine dist-desklink/engine-darwin-arm64 --platform darwin-arm64
          packages/desktop-host/release/check-install.sh | tee dist-desklink/darwin-install-smoke.txt
          {
            uname -a
            git rev-parse HEAD 'HEAD^{tree}'
            git archive HEAD | shasum -a 256
            shasum -a 256 package-lock.json packages/desktop-host/engine/Cargo.lock packages/desktop-host/release/build-engine-macos-arm64.sh
            brew info --json=v2 libvpx
            shasum -a 256 "$(brew --prefix libvpx)/lib/libvpx.a"
            dist-desklink/engine-darwin-arm64/desklink-host version
            dist-desklink/engine-darwin-arm64/desklink-host capabilities
            otool -L dist-desklink/engine-darwin-arm64/desklink-host
            shasum -a 256 dist-desklink/engine-darwin-arm64/* dist-desklink/*.tgz
          } > dist-desklink/darwin-build-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-release
          path: |
            dist-desklink/engine-darwin-arm64/
            dist-desklink/desklink-host-darwin-arm64-*.tgz
            dist-desklink/darwin-build-manifest.txt
            dist-desklink/darwin-install-smoke.txt
          if-no-files-found: error

  # The glass-to-glass latency/fps lab: a stamp target on a private Xvfb, read
  # back in headless Chromium. Report-only (continue-on-error): CI runners are
  # small and contended, so their numbers are a floor, not a gate. Runs only
  # when the engine changed.
  g2g-lab:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev \
            libvpx-dev libpipewire-0.3-dev libxkbcommon-dev libwayland-dev libfreetype6-dev libfontconfig1-dev libevdev-dev libxcb1-dev libxcursor-dev libxext-dev xvfb x11-utils xauth
          npx -y playwright@1.62.1 install --with-deps chromium
      - name: Rust (the version the release build pins)
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            packages/desktop-host/engine/target
          key: engine-linux-${{ hashFiles('packages/desktop-host/engine/Cargo.lock') }}
      - run: npm ci && npm run build
      - run: cargo build --manifest-path packages/desktop-host/engine/Cargo.toml
      - name: Locate Playwright Chromium
        run: |
          chrome=$(find ~/.cache/ms-playwright -path '*chrome-linux/chrome' | head -1)
          if [ -z "$chrome" ]; then chrome=$(find ~/.cache/ms-playwright -name 'headless_shell' | head -1); fi
          echo "chromium: $chrome"
          echo "DESKLINK_CHROME=$chrome" >> "$GITHUB_ENV"
      - run: node packages/desktop-host/test/g2g-flow.mjs --size 1280x720 --seconds 10
        env:
          DESKLINK_AXI_ENGINE: ${{ github.workspace }}/packages/desktop-host/engine/target/debug/desklink-host
