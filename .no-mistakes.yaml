# no-mistakes repository config for desklink.
#
# The Test step's live-validation runbook is the done-done journey set in
# .done-done.yaml. Like every
# test.instructions value it is honored only from the trusted default-branch
# copy of this file, so it takes effect once this change reaches the default
# branch. CI stays defined by .github/workflows/*.yml; nothing here regenerates
# or overrides it.
test:
  instructions: |
    Live validation runs the done-done journeys in .done-done.yaml, not ad-hoc
    commands. The `verify` journey (live-desktop proof plus phone form factors)
    is the gate; `link-drop` covers the userspace-shaped recovery flow; every
    pass claim must name the journey it actually exercised.

    Proof is the journey driving the real user journey, with ambient
    desktop variables removed, into the run's own evidence folder outside the
    worktree:

      done-done run verify

    Exit 0 with a passing receipt means the real locator-pointer click on #video
    reached the fixture
    (independent numeric button edges), the painted marker returned in decoded
    video pixels, a wrong-token handshake was refused without fixture change,
    the phone client fitted portrait and landscape with a fixture-confirmed tap
    and recorded pinch zoom,
    and owned teardown left zero survivors; on any failure inspect the run
    evidence and
    stop at the first failed boundary instead of patching product code.
    Evidence (01-before.png, 02-after.png, events.jsonl, run.json, logs) stays
    private: never commit media, bridge tokens or evidence to the PR.

    Platform limits, stated accurately: the desktop journey requires Linux with
    Xvfb, xauth, an installed playwright-core and headless Chromium, and never
    touches a person's display, browser profile or a shared browser; ambient
    DISPLAY/WAYLAND_DISPLAY are refused and Chromium's XDG_RUNTIME_DIR is never
    overridden. Keyboard/clipboard in the browser, mobile and portal surfaces
    have no proof in these journeys: do not claim or infer them from a browser
    click.

    Asks, reports and evidence go through sign-off-axi on the .sign-off board,
    not ad-hoc channels.
