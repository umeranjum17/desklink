[package]
name = "desklink-host"
version = "0.5.1"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Per-user on-demand desktop capture, encode and input engine speaking a versioned local control protocol"
publish = false

[[bin]]
name = "desklink-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "signal"] }
libc = "0.2"
bytes = "1"
webrtc = { version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc = { version = "0.21", default-features = false, features = ["crypto-ring"] }
log = "0.4"
async-trait = "0.1"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pipewire = { version = "0.10", features = ["v0_3_44"] }
xkbcommon = "0.8"
x11rb = { version = "0.14", default-features = false, features = ["allow-unsafe-code", "xtest", "shm", "damage"] }
wl-clipboard-rs = "0.9"
# H.264 fallback: Cisco's prebuilt openh264, loaded at runtime (never built
# from source), fetched once as bzip2 and checked against a pinned sha256.
openh264-sys2 = { version = "0.9.8", default-features = false, features = ["libloading"] }
sha2 = "0.10"
bzip2-rs = "0.1.2"
# Hidden-cursor positions (ext-image-copy-capture-v1, a staging protocol);
# already in the tree through wl-clipboard-rs.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The Wayland stamp example's lab pointer; already in the tree through wl-clipboard-rs.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = "0.61.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "SCError", "SCScreenshotManager", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSString"] }
objc2-core-media = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGImage", "CGDataProvider"] }
block2 = "0.6"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
opt-level = 2
