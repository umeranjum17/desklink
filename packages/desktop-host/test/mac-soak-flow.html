<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>desklink macOS soak client</title>
<!--
  The browser half of `mac-soak-flow.mjs`: the client package's own web
  implementation (`native.web.ts`) driven the way `g2g-flow.html` drives it, but
  commanded over a WebSocket by the soak driver instead of a CDP session.

  It measures two things, both on this page's one clock (the fixture and the
  browser share the Mac, so nothing is compared across machines):
    - frames: the wall-clock time of every presented frame, drained by the driver
      to compute one-second fps windows;
    - echo: a key goes out on the control channel, and the time to the first
      presented frame in which the fixture's echo cell has flipped is the
      keystroke latency.
  The echo cell is read from the decoded video at the rectangle the driver passes
  in desktop points (`echo=x,y,w,h`) scaled by `geometry.encoded` over `points=W,H`.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #surface { position: absolute; inset: 0; overflow: hidden; }
</style>
</head>
<body>
<div id="surface"></div>
<script>
window.__pcs = [];
const RealRTCPeerConnection = window.RTCPeerConnection;
window.RTCPeerConnection = function (...args) {
    const pc = new RealRTCPeerConnection(...args);
    window.__pcs.push(pc);
    return pc;
};
window.RTCPeerConnection.prototype = RealRTCPeerConnection.prototype;
</script>
<script type="module">
import { attachSurface, nativeDesklink } from '/packages/desktop-client/src/native.web.ts';

const query = new URLSearchParams(location.search);
const [ex, ey, ew, eh] = query.get('echo').split(',').map(Number);
const [pointsW, pointsH] = query.get('points').split(',').map(Number);
const [fx, fy, fw, fh] = query.get('fixture').split(',').map(Number);
const wall = (t) => Math.round(performance.timeOrigin + t);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

let socket = null;
let nextId = 0;
const pending = new Map();
const state = { localId: null, sessionId: null, geometry: null, presented: false, failure: null, rejection: null };
let frames = [];        // wall-clock ms of every presented frame, drained by the driver
let level = null;       // is the echo cell lit in the latest frame
let waiter = null;      // { level, sentAt, resolve } while a key waits for its echo
const watched = new WeakSet();
const sample = document.createElement('canvas');
sample.width = sample.height = 8;
const sampleContext = sample.getContext('2d', { willReadFrequently: true });
const clip = document.createElement('canvas');
clip.width = 640;
clip.height = Math.round((640 * fh) / fw);
const clipContext = clip.getContext('2d');
let recorder = null;

function request(method, params) {
    const id = ++nextId;
    return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        socket.send(JSON.stringify({ id, method, params: params ?? {} }));
        setTimeout(() => { if (pending.delete(id)) reject(new Error(`${method} timed out`)); }, 20_000);
    });
}

nativeDesklink.addListener('onSessionEvent', async (event) => {
    if (event.sessionId !== state.localId) return;
    if (event.name === 'answer') {
        await request('session.description', { session_id: state.sessionId, description: { type: 'answer', sdp: String(event.payload.sdp ?? '') } });
    } else if (event.name === 'candidate') {
        await request('session.candidate', {
            session_id: state.sessionId,
            candidate: String(event.payload.candidate ?? ''),
            sdp_mid: event.payload.sdpMid ?? null,
            sdp_m_line_index: event.payload.sdpMLineIndex ?? null,
        }).catch(() => undefined);
    } else if (event.name === 'presented') {
        state.presented = true;
    } else if (event.name === 'control') {
        const reply = JSON.parse(String(event.payload.message ?? '{}'));
        if (reply.kind === 'rejected') state.rejection = `${reply.code}: ${reply.message}`;
    } else if (event.name === 'failure') {
        state.failure = event.payload;
    }
});

function onMessage(message) {
    const payload = JSON.parse(message.data);
    if (payload.id !== undefined) {
        const waiting = pending.get(payload.id);
        if (waiting === undefined) return;
        pending.delete(payload.id);
        if (payload.error) waiting.reject(new Error(`${payload.error.code}: ${payload.error.message}`));
        else waiting.resolve(payload.result);
    } else if (payload.event === 'session.description') {
        nativeDesklink.setRemoteDescription(state.localId, 'offer', payload.params.description.sdp);
    } else if (payload.event === 'session.candidate') {
        nativeDesklink.addRemoteCandidate(state.localId, payload.params.candidate, payload.params.sdpMid ?? null, payload.params.sdpMLineIndex ?? null);
    }
}

/** Per presented frame: count it, read the echo cell, feed the clip canvas. */
function watch(video) {
    if (watched.has(video) || typeof video.requestVideoFrameCallback !== 'function') return;
    watched.add(video);
    const step = (_now, metadata) => {
        const at = metadata.expectedDisplayTime ?? performance.now();
        frames.push(wall(at));
        const g = state.geometry?.encoded;
        if (g && video.videoWidth) {
            const k = g.width / pointsW;
            const scale = video.videoWidth / g.width;
            sampleContext.drawImage(video, ex * k * scale, ey * k * scale, ew * k * scale, eh * k * scale, 0, 0, 8, 8);
            const data = sampleContext.getImageData(0, 0, 8, 8).data;
            let sum = 0;
            for (let i = 1; i < data.length; i += 4) sum += data[i];
            level = sum / 64 > 128;
            if (waiter !== null && level !== waiter.level) {
                waiter.resolve(Math.max(0, Math.round((at - waiter.sentAt) * 10) / 10));
                waiter = null;
            }
        }
        // The clip shows the owned fixture only, never the rest of the desktop.
        if (recorder !== null && g && video.videoWidth) {
            const k = (g.width / pointsW) * (video.videoWidth / g.width);
            clipContext.drawImage(video, fx * k, fy * k, fw * k, fh * k, 0, 0, clip.width, clip.height);
        }
        video.requestVideoFrameCallback(step);
    };
    video.requestVideoFrameCallback(step);
}

function echo(text) {
    return new Promise((resolve) => {
        const sentAt = performance.now();
        const timer = setTimeout(() => { waiter = null; resolve(null); }, 5000);
        waiter = { level, sentAt, resolve: (ms) => { clearTimeout(timer); resolve(ms); } };
        const character = text;
        nativeDesklink.sendControl(state.localId, JSON.stringify({ kind: 'key', character, modifiers: [], down: true }));
        nativeDesklink.sendControl(state.localId, JSON.stringify({ kind: 'key', character, modifiers: [], down: false }));
    });
}

const commands = {
    async connect({ engine }) {
        const started = performance.now();
        Object.assign(state, { sessionId: null, presented: false, failure: null, rejection: null });
        level = null;
        socket = new WebSocket(engine);
        socket.addEventListener('message', onMessage);
        await new Promise((resolve, reject) => { socket.addEventListener('open', resolve, { once: true }); socket.addEventListener('error', () => reject(new Error('bridge socket failed')), { once: true }); });
        state.localId = nativeDesklink.createSession('[]');
        if (state.localId === null) throw new Error('the web session could not be created');
        const opened = await request('session.open', { max_fps: Number(query.get('maxFps')) });
        Object.assign(state, { sessionId: opened.sessionId, geometry: opened.geometry });
        attachSurface(state.localId, document.getElementById('surface'));
        const video = document.querySelector('#surface video');
        watch(video);
        video?.play?.().catch(() => undefined);
        while (!(state.presented && level !== null)) {
            if (state.failure) throw new Error(`session failed: ${JSON.stringify(state.failure)}`);
            if (performance.now() - started > 30_000) throw new Error('no picture within 30 s of opening the session');
            await sleep(50);
        }
        return { first_frame_ms: Math.round(performance.now() - started), geometry: opened.geometry };
    },
    /** Drop the connection without telling the engine: a lost client, not a clean close. */
    disconnect() {
        nativeDesklink.closeSession(state.localId);
        socket?.close();
        socket = null;
        state.presented = false;
        return true;
    },
    async type({ text, gap_ms }) {
        const out = [];
        for (const character of text) {
            out.push(await echo(character));
            await sleep(gap_ms);
        }
        return { echo_ms: out, rejection: state.rejection };
    },
    frames() {
        const out = frames;
        frames = [];
        return out;
    },
    metrics() {
        return request('session.metrics', { session_id: state.sessionId });
    },
    clip_start() {
        recorder = new MediaRecorder(clip.captureStream(30), { mimeType: 'video/webm', videoBitsPerSecond: 1_500_000 });
        recorder.chunks = [];
        recorder.ondataavailable = (e) => recorder.chunks.push(e.data);
        recorder.start(1000);
        return true;
    },
    async clip_stop() {
        const done = new Promise((resolve) => { recorder.onstop = resolve; });
        recorder.stop();
        await done;
        const blob = new Blob(recorder.chunks, { type: 'video/webm' });
        recorder = null;
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let binary = '';
        for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        return btoa(binary);
    },
};

const control = new WebSocket(query.get('control'));
control.addEventListener('message', async (message) => {
    const { id, cmd, args } = JSON.parse(message.data);
    try {
        control.send(JSON.stringify({ id, result: await commands[cmd](args ?? {}) }));
    } catch (error) {
        control.send(JSON.stringify({ id, error: String(error?.message ?? error) }));
    }
});
control.addEventListener('open', () => control.send(JSON.stringify({ ready: true })));
</script>
</body>
</html>
