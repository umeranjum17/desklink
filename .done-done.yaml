# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "desklink"
journeys:
  versions:
    command: bash packages/desktop-host/test/prove-versions.sh
  verify:
    command: env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-host/test/prove-live-desktop.mjs $DONE_DONE_EVIDENCE_ROOT/verify && env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-host/test/prove-phone-form-factors.mjs $DONE_DONE_EVIDENCE_ROOT/verify
  live-desktop:
    command: env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-host/test/prove-live-desktop.mjs $DONE_DONE_EVIDENCE_ROOT/live-desktop
  phone:
    command: mkdir -p $DONE_DONE_EVIDENCE_ROOT/phone && env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-host/test/prove-phone-form-factors.mjs $DONE_DONE_EVIDENCE_ROOT/phone
  system-audio:
    command: env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-host/test/audio-flow.mjs $DONE_DONE_EVIDENCE_ROOT/system-audio
  link-drop:
    command: env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-client/test/link-drop-flow.mjs $DONE_DONE_EVIDENCE_ROOT/link-drop
  reattach-race:
    command: env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-client/test/reattach-grace-race-flow.mjs $DONE_DONE_EVIDENCE_ROOT/reattach-race
  caret:
    command: env -u DISPLAY -u WAYLAND_DISPLAY DESKLINK_CARET_FLOW=1 DESKLINK_OCR_EVIDENCE=$DONE_DONE_EVIDENCE_ROOT/caret node packages/axi/test/flow.mjs
  portal-keys:
    command: bash packages/desktop-host/test/prove-portal-keys.sh
  x11-agent-cue:
    command: env -u DISPLAY -u WAYLAND_DISPLAY node packages/desktop-host/test/prove-x11-agent-cue.mjs $DONE_DONE_EVIDENCE_ROOT/x11-agent-cue
# Conditional coverage (not default journeys): Mac-only iOS journeys run via
# packages/desktop-client/test/ios-flow.mjs on the Mac's own simulator, with
# DESKLINK_IOS_GLASS=1 DESKLINK_IOS_IPAD=1 for finger-on-glass; bridge-retention
# and carrier/hook reattach matrices run via packages/desktop-client/test/roam-flow.mjs
# with --product-retention and the adapter flags its header documents; a first
# open on a path that never forms (UDP discarded before connect) runs there via
# --scenario never-connected --adapter hook: one `never-connected` failure, one
# open and one close in 60 s.
# Window-share pointer refusal runs via packages/desktop-host/test/portal-g2g-flow.mjs
# --input-proof in its private sway cage, with DESKLINK_PORTAL_XDPW naming an
# xdg-desktop-portal-wlr that reports a window's size (its header has the recipe).
# The Android journey (live picture, tap, tap-to-desktop-point mapping, cursor) runs
# via packages/desktop-client/test/android-flow.mjs on an attached emulator or
# phone (ANDROID_SERIAL, DESKLINK_ANDROID_HOST=10.0.2.2 on an emulator).
# The Android roam cut (12 s owned path cut in an in-process relay, same-session
# recovery judged on the relay clock against the 2 s bar, tap after each run) runs
# via packages/desktop-client/test/android-roam-flow.mjs on an attached emulator or
# phone (ANDROID_SERIAL, DESKLINK_ANDROID_OUT, DESKLINK_ROAM_APP_ADDRESS = this
# host's LAN IPv4; its header has the recipe).
# The relay-only Android journey (picture, tap and status over the app's own TCP
# relay, never `reconnecting` after the first live) is packages/desktop-client/test/
# link-tcp-flow.mjs, run on an attached emulator or phone per its header. Its relay
# runs on its own thread (test/tcp-relay.mjs); test/tcp-relay.test.mjs (in `npm test`)
# checks that relaying continues while the thread that started it is blocked, and
# that pre-dial bytes arrive in order.
# The engine's IPv6 path (IPv6 host candidates, picture to a client that can only
# send from ::1) runs via `cargo test --bin desklink-host peer::tests::` in
# packages/desktop-host/engine; it skips with a printed reason on a host with no
# IPv6 address, so run it in a private `unshare -rn` netns with a ULA on a dummy link
# and a 224.0.0.0/4 route on it (the mDNS socket needs one).
# Hyprland window-share taps run via packages/desktop-host/test/portal-g2g-flow.mjs
# --hyprland-input-proof, with DESKLINK_PORTAL_AQUAMARINE naming the patched
# aquamarine its header describes.

# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
